[package]
name = "whisper-core"
description = "Pure core engine: session FSM, pipeline orchestrator, ports/adapters. See ARCHITECTURE.md §3."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = { version = "3.5", optional = true }

[features]
# Exposes fixture WAV / capture-sink adapters (src/test_support.rs) for downstream
# integration tests that drive production adapters through the real Pipeline.
test-support = ["dep:hound"]

[dev-dependencies]
hound = "3.5"
