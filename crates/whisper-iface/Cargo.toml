[package]
name = "whisper-iface"
description = "whisperd host: HTTP/WS interface layer over whisper-core. See ARCHITECTURE.md §4."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default so the headless build stays pure (D-0012). Enabling it composes the macOS
# platform adapters (cpal mic, rdev hotkey, pasteboard sink) into whisperd.
platform = ["dep:whisper-platform"]

[dependencies]
whisper-core = { path = "../whisper-core" }
# macOS platform adapters, only linked with the `platform` feature (D-0012).
whisper-platform = { path = "../whisper-platform", optional = true }
# Production STT adapter (ARCHITECTURE.md §3.1: heavy native deps live here, not in core).
whisper-rs = "0.16"
# NFC normalization boundary for STT output (ARCHITECTURE.md §3.3).
unicode-normalization = "0.1"
# WAV loading for the transcribe_file helper.
hound = "3.5"
# Silero VAD (D-0008): bundles the Silero V5 ONNX model (MIT); ONNX inference via `ort`.
# No network at runtime — the model is embedded in the crate.
voice_activity_detector = "0.2"
# Error type for the VAD/cleanup adapters.
thiserror = "2"
# Production cleanup LLM adapter (D-0005): llama.cpp bindings, in-process. MIT-licensed;
# builds llama.cpp from source (needs cmake + a C++ compiler). No daemon dependency (rules
# out shelling out to llama-cli/-server). `default-features = false` drops `openmp` (a macOS
# build-friction point; unneeded — Metal + Accelerate do the work on Apple Silicon); `metal`
# is added in the macOS target block below.
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
base64 = "0.22.1"
dirs = "6.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# In-app model provisioning (D-0015): blocking HTTPS download of catalog models, run on
# `tokio::task::spawn_blocking`. rustls-based (no OpenSSL); already a workspace dep pattern
# (whisper-ux uses it for the whole /v1 client).
ureq = { version = "3.3.0", features = ["json"] }
# SHA-256 verification of downloaded model bytes against the pinned catalog (D-0015). The
# only new third-party dependency this feature adds (MIT/Apache-2.0, RustCrypto, offline).
sha2 = "0.10"

# whisper.cpp on Apple Silicon runs on Metal (D-0004).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# llama.cpp on Apple Silicon runs on Metal too (D-0005: qwen3:8b Q4_K_M resident).
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common", "metal"] }

[dev-dependencies]
# Enable the shared fixture adapters for the real-model integration tests.
whisper-core = { path = "../whisper-core", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
