[package]
name = "whisper-iface"
description = "whisperd host: HTTP/WS interface layer over whisper-core. See ARCHITECTURE.md §4."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
whisper-core = { path = "../whisper-core" }
# Production STT adapter (ARCHITECTURE.md §3.1: heavy native deps live here, not in core).
whisper-rs = "0.16"
# NFC normalization boundary for STT output (ARCHITECTURE.md §3.3).
unicode-normalization = "0.1"
# WAV loading for the transcribe_file helper.
hound = "3.5"
# Silero VAD (D-0008): bundles the Silero V5 ONNX model (MIT); ONNX inference via `ort`.
# No network at runtime — the model is embedded in the crate.
voice_activity_detector = "0.2"
# Error type for the VAD/cleanup adapters.
thiserror = "2"
# Production cleanup LLM adapter (D-0005): llama.cpp bindings, in-process. MIT-licensed;
# builds llama.cpp from source (needs cmake + a C++ compiler). No daemon dependency (rules
# out shelling out to llama-cli/-server). `default-features = false` drops `openmp` (a macOS
# build-friction point; unneeded — Metal + Accelerate do the work on Apple Silicon); `metal`
# is added in the macOS target block below.
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }

# whisper.cpp on Apple Silicon runs on Metal (D-0004).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# llama.cpp on Apple Silicon runs on Metal too (D-0005: qwen3:8b Q4_K_M resident).
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common", "metal"] }

[dev-dependencies]
# Enable the shared fixture adapters for the real-model integration tests.
whisper-core = { path = "../whisper-core", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
